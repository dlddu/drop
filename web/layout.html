{{define "head"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · drop</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><a class="brand" href="/get">drop</a></header>
<main>{{end}}

{{define "foot"}}</main>
<footer class="foot">파일은 정해진 기간이 지나면 자동으로 지워집니다 (최대 30일).</footer>
</body>
</html>{{end}}

{{define "uploader"}}
<form id="uploader" class="card" data-api="{{.API}}" data-max-file="{{.MaxFile}}" data-max-files="{{.MaxFiles}}">
  <label class="drop-zone" id="zone">
    <input type="file" id="files" multiple>
    <span class="zone-title">파일을 끌어다 놓거나 눌러서 고르세요</span>
    <span class="hint">파일 하나 {{bytes .MaxFile}}까지 · 최대 {{.MaxFiles}}개</span>
  </label>
  <ul id="picked" class="picked"></ul>
  <div class="row">
    <label>보관 기간
      <select id="days">{{range $d := seq .MaxDays}}<option value="{{$d}}"{{if eq $d $.DefaultDays}} selected{{end}}>{{$d}}일</option>{{end}}</select>
    </label>
    <label>아이디 <span class="hint">(비우면 자동)</span>
      <input id="dropid" autocomplete="off" spellcheck="false" placeholder="예: trip-photos" pattern="[a-z0-9][a-z0-9-]{2,39}">
    </label>
    <label>비밀번호 <span class="hint">(비우면 자동, 6자 이상)</span>
      <input id="droppw" autocomplete="new-password" spellcheck="false" minlength="6">
    </label>
  </div>
  <button type="submit" id="go" class="primary" disabled>올리기</button>
  <div id="progress" class="progress" hidden><div class="bar" id="bar"></div><span id="ptext"></span></div>
  <p id="uerr" class="error" hidden></p>
</form>
<section id="result" class="card result" hidden>
  <h2>보관함이 만들어졌어요</h2>
  <p>받는 사람에게 아래 정보를 전달하세요.</p>
  <dl>
    <dt>주소</dt><dd><code id="r-url"></code></dd>
    <dt>아이디</dt><dd><code id="r-id"></code></dd>
    <dt>비밀번호</dt><dd><code id="r-pw"></code></dd>
    <dt>보관 기한</dt><dd id="r-exp"></dd>
  </dl>
  <button type="button" id="r-copy">전달용 문구 복사</button>
  <button type="button" id="r-again" class="ghost">또 올리기</button>
</section>
{{end}}
